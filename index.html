<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Game Boy · 1989</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="loader"><span>cargando</span><i></i></div>

    <header id="mark">
      <b>DMG‑01</b>
      <span>una consola de 1989 sobre la mesa</span>
    </header>

    <div id="tip"></div>
    <div id="toast"></div>

    <footer id="hud">
      <div id="cta">Haz clic para coger la consola</div>
      <div id="keys">
        <span><kbd>P</kbd> encender</span>
        <span><kbd>←↑↓→</kbd> cruceta</span>
        <span><kbd>X</kbd> A</span>
        <span><kbd>Z</kbd> B</span>
        <span><kbd>Enter</kbd> start</span>
        <span><kbd>Shift</kbd> select</span>
        <span><kbd>C</kbd> cambiar cartucho</span>
        <span><kbd>Esc</kbd> dejar en la mesa</span>
      </div>
    </footer>

    <a id="credit" href="https://skfb.ly/o8DRy" target="_blank" rel="noopener">modelo 3D: Lokeig · CC BY‑NC</a>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
